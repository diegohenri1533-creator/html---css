<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abri esse site em varios </p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/img-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/images.jpg" type="image/png">
        <img src="imagens/img.g.jpg" alt="imagem flexivel">
    </picture>
    <h1> Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5</p>
    <audio src="midia/audio.mp3" autoplay controls>
    <source src="midia/audio.mp3" type="audio/mpeg">
    <source src="midia/audio.mp3" type="audio/ogg">
    <p>Infelizmente seu navegador nao consegue reproduzi audio. <a href="midia/audio.mp3">Clique aqui para baixar o arquino MP3</a></p>
    </audio>
</body>
</html>
